<script>
(() => {
 // קוד שותף = הקטע האחרון בכתובת (/he/partner/hillel). שותף חדש = שורה אחת כאן.
 const PARTNERS = { hillel: "הלל" };
 const code = (location.pathname.split("/").filter(Boolean)[2] || "").toLowerCase(), who = PARTNERS[code] || "";
 const OFFERS = [
  ["אתרים", "מאתר מרהיב ב־48 שעות ועד אתר פרימיום וחנות רב־לשונית.", "החל מ־₪4,900"],
  ["אפליקציות", "SaaS, אנדרואיד, טלפון ומחשב — מוצר שלם, מהעיצוב ועד ההשקה.", "לפי הצעה"],
  ["SaaS ו־CRM לעסקים", "CRM בהתאמה שמחובר לוואטסאפ ולחשבוניות, הצעות מחיר ותורים.", "לפי הצעה"],
  ["אוטומציות", "המשימות שחוזרות על עצמן נעשות לבד — מיילים, לידים, דוחות.", "לפי הצעה"],
  ["לנהל את כל העסק עם AI מהטלפון", "וואטסאפ, מיילים, יומן ומשימות במקום אחד, עם עוזר AI שעונה ומבצע.", "לפי הצעה"],
  ["אינסטגרם, רילס ווידאו", "רילס ו־Shorts, סרטי מותג ו־AI — עם כתוביות בעברית, באנגלית ובצרפתית.", "סרט AI החל מ־₪11,500"],
  ["תלת־ממד ואדריכלות", "עולמות תלת־ממד באתר, אולמות תצוגה וירטואליים והדמיות.", "החל מ־₪39,000"],
  ["AI בהתאמה אישית", "עוזר שמאומן על הנתונים שלכם — בענן או אצלכם, רק בשבילכם.", "החל מ־₪49,000"]
 ];
 const msg = "שלום דוד, הגעתי" + (who ? ` דרך ${who} (קוד: ${code.toUpperCase()})` : " מהאתר של DreamNova") + " ואשמח לדבר על פרויקט.";
 const waUrl = extra => "https://wa.me/972584921492?text=" + encodeURIComponent(msg + (extra ? " — " + extra : ""));
 const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
 // shortcut: compteur public sans donnée personnelle (abacus) ; passer à Vercel Analytics si un vrai rapport est demandé
 const hit = k => { try { fetch(`https://abacus.jasoncameron.dev/hit/dreamnova-partner/${who ? code : "other"}-${k}`, { mode: "no-cors", keepalive: true }); } catch (e) {} };
 if (who) { const r = document.querySelector("[data-ref]"); r.textContent = "בהמלצת " + who; r.hidden = false; document.querySelector("[data-eyebrow]").style.display = "none"; }
 document.querySelector("[data-wa]").href = waUrl();
 document.querySelector("[data-list]").innerHTML = OFFERS.map(([t, d, p], i) => `<li><a class="cx__card${i ? "" : " cx__card--main"}" data-go href="${waUrl(t)}" target="_blank" rel="noopener"><span class="cx__n" aria-hidden="true">0${i + 1}</span><span class="cx__body"><b>${esc(t)}</b><span>${esc(d)}</span></span><span class="pt__price">${esc(p)}</span></a></li>`).join("");
 document.addEventListener("click", e => { if (e.target.closest("[data-wa],[data-go]")) hit("wa"); });
 hit("visit");
 const v = document.querySelector(".cx__vid");
 if (v && !matchMedia("(prefers-reduced-motion: reduce)").matches && innerWidth > 899) { v.src = v.dataset.src; v.play().catch(() => {}); }
})();
</script>
