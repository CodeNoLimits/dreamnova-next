<main id="top">
  <section class="hero">
    <canvas class="hero__gl" aria-hidden="true"></canvas>
    <div class="hero__fallback" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="eyebrow hero__eyebrow"><span class="pulse"></span><span data-i="hero.eyebrow"></span></p>
      <h1 class="hero__title"><span class="line"><span data-i="hero.l1"></span></span><span class="line"><em data-i="hero.l2"></em></span></h1>
      <p class="hero__sub" data-i="hero.sub"></p>
      <div class="hero__ctas">
        <a class="btn btn--gold magnetic" href="#work"><span data-i="hero.cta1"></span><span class="btn__ico">↘</span></a>
        <a class="btn btn--glass magnetic" data-wa="hero" href="#contact"><span data-i="hero.cta2"></span><span class="btn__ico">↗</span></a>
      </div>
    </div>
    <div class="hero__stats" data-stats></div>
    <div class="hero__scroll" aria-hidden="true"><span></span></div>
  </section>

  <section class="drive" id="drive">
    <div class="drive__pin">
      <canvas class="drive__seq" aria-hidden="true"></canvas>
      <div class="drive__cockpit" aria-hidden="true"><video class="drive__loop" muted loop playsinline preload="none"></video></div>
      <div class="drive__shade" aria-hidden="true"></div>
      <div class="drive__intro">
        <img class="drive__crest" src="assets/brand/crest.svg" alt="" width="84" height="105">
        <p class="eyebrow eyebrow--gold" data-d="eyebrow"></p>
        <h2 class="drive__title"><span data-d="l1"></span> <em data-d="l2"></em></h2>
        <p class="drive__sub" data-d="sub"></p>
      </div>
      <div class="drive__hots" role="list"></div>
      <nav class="drive__chips" aria-label="cockpit"></nav>
      <p class="drive__hint" data-d="hint"></p>
    </div>
  </section>

  <section class="marquee" aria-label="stack"><div class="marquee__track" data-marquee></div></section>

  <section class="work" id="work">
    <div class="work__pin">
      <div class="work__head">
        <p class="eyebrow" data-i="work.eyebrow"></p>
        <h2 class="h2" data-i="work.title"></h2>
        <p class="lead" data-i="work.lead"></p>
      </div>
      <div class="work__viewport"><div class="work__track" data-reel></div></div>
      <div class="work__progress"><span></span></div>
    </div>
  </section>

  <section class="manifesto"><p class="manifesto__text" data-manifesto></p></section>

  <section class="rooms" id="rooms">
    <div class="rooms__pin">
      <canvas class="rooms__gl" aria-hidden="true"></canvas>
      <div class="rooms__ui">
        <div class="rooms__head"><p class="eyebrow eyebrow--gold" data-r="eyebrow"></p><h2 class="rooms__title" data-r="title"></h2></div>
        <div class="rooms__cap" aria-live="polite"><span class="rooms__num" dir="ltr"></span><h3 class="rooms__name"></h3><p class="rooms__line"></p></div>
        <ol class="rooms__dots"></ol>
        <p class="rooms__hint" data-r="hint"></p>
      </div>
      <div class="rooms__fallback"></div>
    </div>
  </section>

  <section class="services" id="services">
    <div class="sec-head">
      <p class="eyebrow" data-i="svc.eyebrow"></p>
      <h2 class="h2" data-i="svc.title"></h2>
      <p class="lead" data-i="svc.lead"></p>
    </div>
    <div class="bento" data-bento></div>
  </section>

  <section class="refer" id="refer">
    <div class="sec-head">
      <p class="eyebrow eyebrow--gold" data-i="ref.eyebrow"></p>
      <h2 class="h2" data-i="ref.title"></h2>
      <p class="lead" data-i="ref.lead"></p>
    </div>
    <div class="refer__grid" data-refer></div>
    <div class="shell partner reveal">
      <div class="core partner__core">
        <div class="partner__intro">
          <p class="eyebrow" data-i="ref.p_eyebrow"></p>
          <h3 class="h3" data-i="ref.p_title"></h3>
        </div>
        <ol class="partner__steps" data-psteps></ol>
        <a class="btn btn--gold magnetic" data-wa="partner" href="#contact"><span data-i="ref.p_cta"></span><span class="btn__ico">↗</span></a>
      </div>
    </div>
  </section>

  <section class="index" id="index">
    <div class="sec-head sec-head--row">
      <div>
        <p class="eyebrow" data-i="idx.eyebrow"></p>
        <h2 class="h2" data-i="idx.title"></h2>
      </div>
      <div class="filters" role="tablist" data-filters></div>
    </div>
    <div class="index__grid" data-index></div>
  </section>

  <section class="offers" id="offers">
    <div class="sec-head">
      <p class="eyebrow" data-i="off.eyebrow"></p>
      <h2 class="h2" data-i="off.title"></h2>
      <p class="lead" data-i="off.lead"></p>
    </div>
    <div class="shell audit reveal">
      <div class="core audit__core">
        <div class="audit__l">
          <p class="eyebrow eyebrow--gold" data-i="off.a_eyebrow"></p>
          <h3 class="h3" data-i="off.a_title"></h3>
          <p class="audit__text" data-i="off.a_text"></p>
        </div>
        <div class="audit__r">
          <div class="audit__price" data-i="off.a_price"></div>
          <a class="btn btn--gold magnetic" data-wa="audit" href="#contact"><span data-i="off.a_cta"></span><span class="btn__ico">↗</span></a>
        </div>
      </div>
    </div>
    <div class="offers__list" data-offers></div>
    <p class="fine" data-i="off.fine"></p>
  </section>

  <section class="process">
    <div class="sec-head">
      <p class="eyebrow" data-i="proc.eyebrow"></p>
      <h2 class="h2" data-i="proc.title"></h2>
    </div>
    <div class="process__steps" data-process></div>
  </section>

  <section class="lab" id="lab">
    <div class="lab__grid-bg" aria-hidden="true"></div>
    <div class="sec-head">
      <p class="eyebrow" data-i="lab.eyebrow"></p>
      <h2 class="h2" data-i="lab.title"></h2>
      <p class="lead" data-i="lab.lead"></p>
    </div>
    <div class="lab__cards" data-lab></div>
    <p class="fine" data-i="lab.fine"></p>
  </section>

  <section class="founder">
    <div class="founder__core reveal">
      <p class="eyebrow" data-i="fnd.eyebrow"></p>
      <blockquote class="founder__quote" data-i="fnd.quote"></blockquote>
      <p class="founder__sig"><strong>David Amor</strong> · <span data-i="fnd.role"></span></p>
    </div>
  </section>

  <section class="quote" id="devis"></section>

  <section class="contact" id="contact">
    <div class="contact__glow" aria-hidden="true"></div>
    <p class="eyebrow" data-i="ct.eyebrow"></p>
    <h2 class="contact__title"><span data-i="ct.l1"></span> <em data-i="ct.l2"></em></h2>
    <p class="lead" data-i="ct.lead"></p>
    <div class="contact__ctas">
      <a class="btn btn--gold btn--xl magnetic" data-wa="contact" target="_blank" rel="noopener"><span data-i="ct.wa"></span><span class="btn__ico">↗</span></a>
    </div>
  </section>
</main>
