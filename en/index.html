<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DreamNova — Studio</title>
<meta name="description" content="DreamNova — AI design & engineering studio, Jerusalem. Websites, 3D, AI film, voice agents, private AI.">
<meta name="theme-color" content="#050403">
<meta property="og:title" content="DreamNova — We build the impossible">
<meta property="og:description" content="AI design & engineering studio · Jerusalem">
<meta property="og:type" content="website">
<meta property="og:image" content="https://codenolimits.github.io/dreamnova-next/assets/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050403'/%3E%3Cpath d='M18 46V18h12c10 0 16 6 16 14s-6 14-16 14z' fill='none' stroke='%23E8CD72' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300..700&family=Rubik:wght@300..800&family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="is-loading">
<div class="grain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"><span class="cursor__ring"></span><span class="cursor__dot"></span><span class="cursor__label"></span></div>

<div class="loader" aria-hidden="true">
  <div class="loader__mark">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="loader__circle"/><path d="M38 86V34h20c18 0 28 11 28 26S76 86 58 86z" class="loader__d"/></svg>
  </div>
  <div class="loader__count"><span>0</span>%</div>
</div>

<header class="nav">
  <a href="#top" class="nav__brand" aria-label="DreamNova"><span class="nav__logo">DN</span><span class="nav__name">DreamNova</span></a>
  <nav class="nav__links" aria-label="main">
    <a href="#work" data-i="nav.work"></a><a href="#services" data-i="nav.services"></a><a href="#refer" data-i="nav.refer"></a><a href="#offers" data-i="nav.offers"></a><a href="#lab" data-i="nav.lab"></a>
  </nav>
  <div class="nav__langs" role="group" aria-label="language"><a href="/he" data-l="he">HE</a><a href="/en" data-l="en">EN</a><a href="/fr" data-l="fr">FR</a></div>
  <a class="btn btn--gold btn--sm magnetic nav__cta" data-wa="nav" href="#contact"><span data-i="nav.cta"></span><span class="btn__ico">↗</span></a>
  <button class="nav__burger" aria-label="menu" aria-expanded="false"><span></span><span></span></button>
</header>
<div class="menu" aria-hidden="true">
  <nav class="menu__links">
    <a href="#work" data-i="nav.work"></a><a href="#services" data-i="nav.services"></a><a href="#refer" data-i="nav.refer"></a><a href="#offers" data-i="nav.offers"></a><a href="#lab" data-i="nav.lab"></a><a href="#contact" data-i="nav.cta"></a>
  </nav>
  <div class="menu__langs"><a href="/he">עברית</a><a href="/en">English</a><a href="/fr">Français</a></div>
</div>

<main id="top">
  <section class="hero">
    <canvas class="hero__gl" aria-hidden="true"></canvas>
    <div class="hero__fallback" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="eyebrow hero__eyebrow"><span class="pulse"></span><span data-i="hero.eyebrow"></span></p>
      <h1 class="hero__title"><span class="line"><span data-i="hero.l1"></span></span><span class="line"><em data-i="hero.l2"></em></span></h1>
      <p class="hero__sub" data-i="hero.sub"></p>
      <div class="hero__ctas">
        <a class="btn btn--gold magnetic" href="#work"><span data-i="hero.cta1"></span><span class="btn__ico">↘</span></a>
        <a class="btn btn--glass magnetic" data-wa="hero" href="#contact"><span data-i="hero.cta2"></span><span class="btn__ico">↗</span></a>
      </div>
    </div>
    <div class="hero__stats" data-stats></div>
    <div class="hero__scroll" aria-hidden="true"><span></span></div>
  </section>

  <section class="marquee" aria-label="stack"><div class="marquee__track" data-marquee></div></section>

  <section class="work" id="work">
    <div class="work__pin">
      <div class="work__head">
        <p class="eyebrow" data-i="work.eyebrow"></p>
        <h2 class="h2" data-i="work.title"></h2>
        <p class="lead" data-i="work.lead"></p>
      </div>
      <div class="work__viewport"><div class="work__track" data-reel></div></div>
      <div class="work__progress"><span></span></div>
    </div>
  </section>

  <section class="manifesto"><p class="manifesto__text" data-manifesto></p></section>

  <section class="services" id="services">
    <div class="sec-head">
      <p class="eyebrow" data-i="svc.eyebrow"></p>
      <h2 class="h2" data-i="svc.title"></h2>
      <p class="lead" data-i="svc.lead"></p>
    </div>
    <div class="bento" data-bento></div>
  </section>

  <section class="refer" id="refer">
    <div class="sec-head">
      <p class="eyebrow eyebrow--gold" data-i="ref.eyebrow"></p>
      <h2 class="h2" data-i="ref.title"></h2>
      <p class="lead" data-i="ref.lead"></p>
    </div>
    <div class="refer__grid" data-refer></div>
    <div class="shell partner reveal">
      <div class="core partner__core">
        <div class="partner__intro">
          <p class="eyebrow" data-i="ref.p_eyebrow"></p>
          <h3 class="h3" data-i="ref.p_title"></h3>
        </div>
        <ol class="partner__steps" data-psteps></ol>
        <a class="btn btn--gold magnetic" data-wa="partner" href="#contact"><span data-i="ref.p_cta"></span><span class="btn__ico">↗</span></a>
      </div>
    </div>
  </section>

  <section class="index" id="index">
    <div class="sec-head sec-head--row">
      <div>
        <p class="eyebrow" data-i="idx.eyebrow"></p>
        <h2 class="h2" data-i="idx.title"></h2>
      </div>
      <div class="filters" role="tablist" data-filters></div>
    </div>
    <div class="index__grid" data-index></div>
  </section>

  <section class="offers" id="offers">
    <div class="sec-head">
      <p class="eyebrow" data-i="off.eyebrow"></p>
      <h2 class="h2" data-i="off.title"></h2>
      <p class="lead" data-i="off.lead"></p>
    </div>
    <div class="shell audit reveal">
      <div class="core audit__core">
        <div class="audit__l">
          <p class="eyebrow eyebrow--gold" data-i="off.a_eyebrow"></p>
          <h3 class="h3" data-i="off.a_title"></h3>
          <p class="audit__text" data-i="off.a_text"></p>
        </div>
        <div class="audit__r">
          <div class="audit__price" data-i="off.a_price"></div>
          <a class="btn btn--gold magnetic" data-wa="audit" href="#contact"><span data-i="off.a_cta"></span><span class="btn__ico">↗</span></a>
        </div>
      </div>
    </div>
    <div class="offers__list" data-offers></div>
    <p class="fine" data-i="off.fine"></p>
  </section>

  <section class="process">
    <div class="sec-head">
      <p class="eyebrow" data-i="proc.eyebrow"></p>
      <h2 class="h2" data-i="proc.title"></h2>
    </div>
    <div class="process__steps" data-process></div>
  </section>

  <section class="lab" id="lab">
    <div class="lab__grid-bg" aria-hidden="true"></div>
    <div class="sec-head">
      <p class="eyebrow" data-i="lab.eyebrow"></p>
      <h2 class="h2" data-i="lab.title"></h2>
      <p class="lead" data-i="lab.lead"></p>
    </div>
    <div class="lab__cards" data-lab></div>
    <p class="fine" data-i="lab.fine"></p>
  </section>

  <section class="founder">
    <div class="founder__core reveal">
      <p class="eyebrow" data-i="fnd.eyebrow"></p>
      <blockquote class="founder__quote" data-i="fnd.quote"></blockquote>
      <p class="founder__sig"><strong>David Amor</strong> · <span data-i="fnd.role"></span></p>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="contact__glow" aria-hidden="true"></div>
    <p class="eyebrow" data-i="ct.eyebrow"></p>
    <h2 class="contact__title"><span data-i="ct.l1"></span> <em data-i="ct.l2"></em></h2>
    <p class="lead" data-i="ct.lead"></p>
    <div class="contact__ctas">
      <a class="btn btn--gold btn--xl magnetic" data-wa="contact" target="_blank" rel="noopener"><span data-i="ct.wa"></span><span class="btn__ico">↗</span></a>
      <a class="btn btn--glass btn--xl magnetic" href="mailto:admin@holyrentals.com?subject=DreamNova"><span>admin@holyrentals.com</span><span class="btn__ico">✉</span></a>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="foot__big" aria-hidden="true">DreamNova</div>
  <div class="foot__row">
    <span>© 2026 DreamNova · David Amor</span>
    <span data-i="foot.where"></span>
    <a href="#top" data-i="foot.top"></a>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="../content.js"></script>
<script src="../app.js"></script>
</body>
</html>
